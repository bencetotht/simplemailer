nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

secrets:
  # Use an existing Secret in production. It must contain the keys below.
  existingSecret: ""
  create: false
  annotations: {}
  keys:
    databaseUrl: DATABASE_URL
    rabbitmqUrl: RABBITMQ_URL
    secretsMasterKey: SECRETS_MASTER_KEY
    dashboardApiKey: DASHBOARD_API_KEY
    dashboardPassword: DASHBOARD_PASSWORD
    dashboardSessionSecret: DASHBOARD_SESSION_SECRET
    rabbitmqApiUser: RABBITMQ_API_USER
    rabbitmqApiPassword: RABBITMQ_API_PASS
    s3AccessKey: S3_ACCESS_KEY
    s3SecretKey: S3_SECRET_KEY
    s3SessionToken: S3_SESSION_TOKEN
  # Convenience for development only. These values are rendered into a Secret.
  values:
    databaseUrl: ""
    rabbitmqUrl: ""
    secretsMasterKey: ""
    dashboardApiKey: ""
    dashboardPassword: ""
    dashboardSessionSecret: ""
    rabbitmqApiUser: ""
    rabbitmqApiPassword: ""
    s3AccessKey: ""
    s3SecretKey: ""
    s3SessionToken: ""

commonLabels: {}
podAnnotations: {}
podLabels: {}

dashboard:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/bencetotht/simplemailer-dashboard
    tag: "0.2.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  config:
    rabbitmqApiUrl: ""
    s3Endpoint: ""
    s3Region: us-east-1
    s3Bucket: ""
    s3ForcePathStyle: false
    s3CreateBucket: false
    trustProxy: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  probes:
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  extraEnv: []
  extraEnvFrom: []
  extraContainers: []
  extraVolumes: []
  extraVolumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

worker:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/bencetotht/simplemailer-worker
    tag: "2.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9091
    annotations: {}
  config:
    rabbitmqQueue: mailer
    s3Endpoint: ""
    s3Region: us-east-1
    s3Bucket: ""
    s3ForcePathStyle: false
    templatePath: ../../templates
    prefetchCount: 1
    maxRetries: 8
    smtpTlsRejectUnauthorized: true
    enqueueReconcilerIntervalMs: 15000
    processingLeaseMs: 120000
    webhookDispatchIntervalMs: 1000
    webhookRequestTimeoutMs: 10000
    webhookLeaseMs: 30000
    webhookMaxAttempts: 8
    webhookDisableAfterFailures: 10
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  probes:
    liveness:
      initialDelaySeconds: 20
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 50
    # Requires a metrics adapter that publishes this Prometheus gauge through
    # the Kubernetes external.metrics.k8s.io API.
    metrics:
      - type: External
        external:
          metric:
            name: mailer_autoscale_pressure
          target:
            type: Value
            value: "1"
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 30
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 10
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        selectPolicy: Min
        policies:
          - type: Percent
            value: 20
            periodSeconds: 60
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  extraEnv: []
  extraEnvFrom: []
  extraContainers: []
  extraVolumes: []
  extraVolumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

migrations:
  enabled: true
  # Runs before dashboard containers. If dashboard is disabled, it runs before workers.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: simplemailer.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

traefik:
  ingressRoute:
    enabled: false
    entryPoints: [websecure]
    annotations: {}
    routes:
      - match: Host(`simplemailer.example.com`)
        kind: Rule
        middlewares: []
    tls: {}

serviceMonitor:
  enabled: false
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  metricRelabelings: []
  relabelings: []

networkPolicy:
  enabled: false
  # Worker egress usually needs DNS, PostgreSQL, RabbitMQ, S3, SMTP, and webhook targets.
  ingress: []
  egress: []

# The apps log to stdout. Prefer a node-level collector, or use these annotations
# for your OpenTelemetry operator's sidecar/instrumentation injection.
observability:
  podAnnotations: {}
