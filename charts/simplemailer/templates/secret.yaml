{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simplemailer.secretName" . }}
  labels:
    {{- include "simplemailer.labels" . | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.databaseUrl }}: {{ required "secrets.values.databaseUrl is required when secrets.create=true" .Values.secrets.values.databaseUrl | quote }}
  {{ .Values.secrets.keys.rabbitmqUrl }}: {{ required "secrets.values.rabbitmqUrl is required when secrets.create=true" .Values.secrets.values.rabbitmqUrl | quote }}
  {{ .Values.secrets.keys.secretsMasterKey }}: {{ required "secrets.values.secretsMasterKey is required when secrets.create=true" .Values.secrets.values.secretsMasterKey | quote }}
  {{- range $name := list "dashboardApiKey" "dashboardPassword" "dashboardSessionSecret" "rabbitmqApiUser" "rabbitmqApiPassword" "s3AccessKey" "s3SecretKey" "s3SessionToken" }}
  {{- with index $.Values.secrets.values $name }}
  {{ index $.Values.secrets.keys $name }}: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
