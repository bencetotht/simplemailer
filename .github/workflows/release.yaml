name: release-sdk

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current SDK version to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://release:release@localhost:5432/release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter dashboard openapi:generate
      - run: git diff --exit-code -- apps/dashboard/openapi.json
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package:smoke
      - name: Confirm versions are not already published
        if: ${{ inputs.publish }}
        run: node scripts/check-package-versions.mjs
      - name: Publish SDK
        if: ${{ inputs.publish }}
        working-directory: packages/sdk
        run: npm publish --access public
